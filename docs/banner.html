<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    html,body{margin:0;padding:0;background:#07080a;overflow:hidden}
    canvas{display:block}
  </style>
</head>
<body>
<canvas id="c" width="1920" height="560"></canvas>
<script>
const W = 1920, H = 560;
const ctx = document.getElementById("c").getContext("2d");

const bg = ctx.createLinearGradient(0, 0, W, H);
bg.addColorStop(0, "#1a0e04");
bg.addColorStop(0.42, "#0c0d10");
bg.addColorStop(1, "#07080a");
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

// Geometric ladder motif (right side)
const floor = 430, ceil = 96, n = 8;
for (let i = 0; i < n; i++) {
  const t = i / (n - 1);
  const y = floor - Math.pow(t, 0.92) * (floor - ceil);
  const alpha = 0.10 + t * 0.42;
  ctx.strokeStyle = i < 4 ? `rgba(255,122,0,${alpha})` : `rgba(74,222,128,${alpha})`;
  ctx.lineWidth = i === 0 || i === n - 1 ? 3 : 2;
  ctx.beginPath();
  ctx.moveTo(1188, y);
  ctx.lineTo(1864, y);
  ctx.stroke();
  ctx.fillStyle = i < 4 ? "#ff7a00" : "#4ade80";
  ctx.beginPath();
  ctx.arc(1188, y, i === 3 || i === 4 ? 6 : 4, 0, Math.PI * 2);
  ctx.fill();
}

ctx.strokeStyle = "rgba(255,122,0,0.55)";
ctx.lineWidth = 3;
ctx.beginPath();
const pts = [0.18, 0.22, 0.16, 0.28, 0.24, 0.38, 0.34, 0.52, 0.46, 0.62, 0.70, 0.84];
pts.forEach((p, i) => {
  const px = 1248 + i * 48;
  const py = 438 - p * 250;
  i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
});
ctx.stroke();

const accent = ctx.createLinearGradient(0, 0, W, 8);
accent.addColorStop(0, "#FF7A00");
accent.addColorStop(1, "#4ade80");
ctx.fillStyle = accent;
ctx.fillRect(0, 0, W, 8);
ctx.fillStyle = "#FF7A00";
ctx.fillRect(0, H - 8, W, 8);

ctx.fillStyle = "#FF7A00";
ctx.font = "700 22px ui-sans-serif, system-ui, sans-serif";
ctx.fillText("MEXC  ·  BTCUSDT  ·  SPOT GRID", 88, 92);

ctx.fillStyle = "#f8fafc";
ctx.font = "800 64px ui-sans-serif, system-ui, sans-serif";
ctx.fillText("MEXC Spot Grid Trading Bot", 88, 186);

ctx.fillStyle = "#94a3b8";
ctx.font = "400 24px ui-sans-serif, system-ui, sans-serif";
ctx.fillText("Geometric ladder. Maker limits. Fee-aware spacing. Price-band shutdown.", 88, 240);

const chips = [
  { t: "BTCUSDT", c: "#FF7A00" },
  { t: "Native REST", c: "#4ade80" },
  { t: "Risk-gated", c: "#fb923c" },
  { t: "8-level desk", c: "#e2e8f0" },
];
let x = 88;
chips.forEach((ch) => {
  ctx.font = "600 20px ui-sans-serif, system-ui";
  const w = ctx.measureText(ch.t).width + 44;
  ctx.fillStyle = "rgba(15,23,42,0.85)";
  ctx.strokeStyle = ch.c;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x, 292, w, 48, 24);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = ch.c;
  ctx.fillText(ch.t, x + 22, 323);
  x += w + 16;
});

ctx.fillStyle = "#64748b";
ctx.font = "500 18px ui-sans-serif, system-ui";
ctx.fillText("Fit the band  ·  cut the rungs  ·  make spacing beat fees  ·  dry-run first", 88, 412);
</script>
</body>
</html>
